
name: Daily iNews Automation

on:
  schedule:
    - cron: '30 02 * * 1-5'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-test:
    name: Run Playwright and Allure
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright Tests
        run: npx playwright test
        env:
          CI: 'true'

      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d allure-results ] && [ -n "$(ls -A allure-results)" ]; then
            npx allure generate allure-results --clean -o allure-report
          else
            echo "Allure results tidak ditemukan"
            exit 1
          fi

      - name: Upload QA Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inews-qa-report
          path: |
            allure-report/
            allure-results/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Screenshot Baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-screenshot-baselines
          path: Tests/**/*-snapshots/**
          if-no-files-found: error
name: Allure Report Experiment

on:
  workflow_dispatch:
    inputs:
      publish_pages:
        description: 'Publish the report to GitHub Pages?'
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: allure-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-report:
    name: Test and generate Allure Classic
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      report_ready: ${{ steps.verify.outputs.ready }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Allure 3 CLI
        run: |
          npx allure --version
          npm ls allure allure-playwright --depth=0

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Find latest prior experiment history
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo,
              workflow_id: 'allure-experiment.yml',
              branch,
              status: 'completed',
              per_page: 30,
            });
            for (const run of data.workflow_runs) {
              if (run.id === context.runId) continue;
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id, per_page: 100,
              });
              const match = result.data.artifacts.find(
                artifact => artifact.name === 'allure-experiment-history' && !artifact.expired
              );
              if (match) {
                core.setOutput('run_id', String(run.id));
                core.info(`Restoring history from run ${run.id}`);
                return;
              }
            }
            core.info('No previous history artifact: first run or artifact expired.');

      - name: Restore previous history
        if: ${{ steps.previous.outputs.run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: allure-experiment-history
          path: allure-history
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run_id }}

      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        env:
          CI: 'true'
        run: |
          rm -rf allure-results allure-report-experiment
          npx playwright test --project="Desktop Chrome" --grep="@demo"
      
      - name: Add GitHub Actions Executor
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const repo = process.env.GITHUB_REPOSITORY;
          const runId = process.env.GITHUB_RUN_ID;
          const runNumber = Number(process.env.GITHUB_RUN_NUMBER);
          const runUrl = `https://github.com/${repo}/actions/runs/${runId}`;

          const executor = {
            name: 'GitHub Actions',
            type: 'github',
            url: `https://github.com/${repo}/actions`,
            buildOrder: runNumber,
            buildName: `iNews Run #${runNumber}`,
            buildUrl: runUrl,
            reportName: `iNews QA Run #${runNumber}`,
            reportUrl: runUrl
          };

          fs.mkdirSync('allure-results', { recursive: true });

          fs.writeFileSync(
            'allure-results/executor.json',
            JSON.stringify(executor, null, 2)
          );
          NODE

      - name: Generate Allure 3 Classic report
        run: |
          test -d allure-results
          find allure-results -name '*-result.json' -print -quit | grep -q .
          npx allure generate ./allure-results --config ./allurerc.experiment.mjs
      
      - name: Preserve Classic Trend History
        run: node scripts/preserve-allure-trends.mjs

      - name: Debug Allure Output
        if: always()
        run: |
          echo '=== Generated HTML ==='
          find allure-report-experiment -name index.html -print 2>/dev/null || true
          echo '=== History ==='
          if [ -f allure-history/history.jsonl ]; then
            wc -l allure-history/history.jsonl
          else
            echo 'History file not found'
          fi

      - name: Validate report and history
        id: verify
        run: |
          test -s allure-report-experiment/index.html
          test -s allure-history/history.jsonl
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'Allure Classic report and history are ready.'

      - name: Save history for the next run
        uses: actions/upload-artifact@v4
        with:
          name: allure-experiment-history
          path: allure-history/
          retention-days: 30
          if-no-files-found: error

      - name: Save report for inspection
        uses: actions/upload-artifact@v4
        with:
          name: allure-experiment-report
          path: allure-report-experiment/
          retention-days: 30
          if-no-files-found: error

      - name: Preserve Playwright failure status
        if: ${{ steps.tests.outcome == 'failure' }}
        run: |
          echo 'Some Playwright tests failed; report/history were still saved.'
          exit 1

  publish:
    name: Deploy latest report and 7-day archive
    needs: test-and-report
    if: ${{ always() && inputs.publish_pages == true && needs.test-and-report.outputs.report_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # This job uses the script from the selected experiment branch.
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download verified latest report
        uses: actions/download-artifact@v4
        with:
          name: allure-experiment-report
          path: ./current-report

      - name: Build latest report and 7-day archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPORT_ARCHIVE_BRANCH: ${{ github.ref_name }}
          REPORT_ARCHIVE_WORKFLOW: allure-experiment.yml
          REPORT_ARCHIVE_DAYS: '7'
          REPORT_CURRENT_DIR: ./current-report
          REPORT_SITE_DIR: ./site
        run: node scripts/build-report-archive.mjs

      - name: Verify Pages website
        run: |
          test -s ./site/index.html
          test -s ./site/archive/index.html
          test -s "./site/runs/${GITHUB_RUN_ID}/index.html"
          echo 'Latest, archive index, and current run archive verified.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
